# Rate limits for the SigmaSwap apps only (everything under /cgi-bin/sigmaswap/).
# Nothing else on the server is counted or limited by this file.
#
#   sudo apt install -y libapache2-mod-qos
#   sudo cp deploy/sigmaswap-ratelimit.conf /etc/apache2/conf-available/
#   sudo a2enmod qos && sudo a2enconf sigmaswap-ratelimit
#   sudo apache2ctl configtest && sudo systemctl restart apache2
#
# Why: the apps have no login, and every api.pl request starts a Python process and
# calls the Ergo explorer. Without a limit one visitor can keep the server busy.

<IfModule mod_qos.c>
    # mark the requests that count: the programs, not the logos and pages
    SetEnvIfNoCase Request_URI "^/cgi-bin/sigmaswap/.*api\.pl" SigmaSwapApi=1
    # ... and the only requests that are ever refused. Without this condition a visitor
    # over the limit would be shut out of every site on this server, not just these apps.
    SetEnvIfNoCase Request_URI "^/cgi-bin/sigmaswap/.*api\.pl" QS_Cond=sigmaswap

    # per visitor (IP address): at most 90 app requests in any 60 seconds.
    # A wallet in normal use makes a handful a minute; phones behind one mobile
    # carrier address share this allowance, which is why it is not lower.
    QS_CondClientEventLimitCount 90 60 SigmaSwapApi sigmaswap

    # everyone together: at most 24 app requests being worked on at the same moment,
    # so a burst cannot start more Python processes than the server can carry
    QS_LocRequestLimitMatch "^/cgi-bin/sigmaswap/.*api\.pl" 24

    # what a limited visitor gets: "429 Too Many Requests" instead of the default 500
    QS_ErrorResponseCode 429

    # ONLY if the site sits behind a CDN or reverse proxy (Cloudflare, nginx): every visitor
    # then arrives from the proxy's address and would share one allowance. Uncomment the
    # line that names the header your proxy sets with the visitor's real address.
    #QS_ClientIpFromHeader CF-Connecting-IP
    #QS_ClientIpFromHeader X-Forwarded-For
</IfModule>
