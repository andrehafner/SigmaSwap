# SigmaSwap - Apache include.  Install as /etc/httpd/conf.d/sigmaswap.conf
#
# PUBLIC app: NO Shibboleth on purpose. It is opened by the Ergo wallet app
# (Mosaik + ErgoPay), which cannot do an interactive Cornell login. The app
# has no accounts and stores nothing; see App_Summary.md.

Alias /apps/sigmaswap /data/AAP_Storage/apps/sigmaswap

<Directory /data/AAP_Storage/apps/sigmaswap>
    Options +ExecCGI -Indexes -FollowSymLinks
    AddHandler cgi-script .pl
    DirectoryIndex index.html
    AllowOverride None

    # Explicitly opt out of any Shibboleth protection inherited from a parent
    # <Location /apps> block, and allow everyone.
    AuthType None
    <IfModule mod_shib.c>
        ShibRequestSetting requireSession false
    </IfModule>
    Require all granted

    SetEnv APP_ENV_FILE /data/AAP_Storage/secrets/sigmaswap.env

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Frame-Options "DENY"
    </IfModule>
</Directory>

# Only the web files are served. Source, docs, the Python helper, the venv and
# anything hidden are never handed out.
<DirectoryMatch "^/data/AAP_Storage/apps/sigmaswap/(venv|deploy|tools|\.git|__pycache__)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /data/AAP_Storage/apps/sigmaswap>
    <FilesMatch "\.(py|pm|sh|md|txt|conf|example|env)$|^\.">
        Require all denied
    </FilesMatch>
</Directory>
