# SigmaSwap, SigmaLP, SigmaMint, SigmaBridge - Apache include (Debian / Ubuntu layout)
#
#   sudo cp deploy/sigmaswap.conf /etc/apache2/conf-available/sigmaswap.conf
#   sudo a2enmod cgid headers && sudo a2enconf sigmaswap && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The apps live in /usr/lib/cgi-bin/sigmaswap and are reached at /cgi-bin/sigmaswap/.
# They are public by design: no login, no accounts (see App_Summary.md).

<Directory /usr/lib/cgi-bin/sigmaswap>
    Options +ExecCGI -Indexes -MultiViews -FollowSymLinks
    AllowOverride None
    Require all granted

    # /cgi-bin/ is a ScriptAlias: Apache would try to RUN every file in it. Here only
    # the .pl files are programs. Pages, scripts, styles and images are plain files.
    SetHandler default-handler
    <FilesMatch "\.pl$">
        SetHandler cgi-script
    </FilesMatch>
    DirectoryIndex index.html

    SetEnv APP_ENV_FILE /etc/sigmaswap/sigmaswap.env

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Frame-Options "DENY"
    </IfModule>
</Directory>

# Only the web files are served. Source, docs, the Python helper, the virtualenv,
# tools and anything hidden are never handed out.
<DirectoryMatch "^/usr/lib/cgi-bin/sigmaswap/(venv|deploy|tools|vendor|\.git|__pycache__)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /usr/lib/cgi-bin/sigmaswap>
    <FilesMatch "\.(py|pm|sh|md|txt|conf|example|env|service|timer)$|^\.">
        Require all denied
    </FilesMatch>
</Directory>
